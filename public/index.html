<style>
*{box-sizing:border-box}
body{margin:0;background:#181818;color:white;font:15px/1.45 system-ui,sans-serif}
canvas{display:block;max-width:100vw}
[hidden]{display:none!important}
#arrival{position:fixed;inset:0;z-index:2;display:grid;place-items:end center;padding:0 20px max(9vh,36px);background:linear-gradient(0deg,#0006,transparent 40%);pointer-events:none}
body[data-view="loading"] #arrival,body[data-view="error"] #arrival{background:linear-gradient(0deg,#111e,rgba(0,0,0,.35) 60%),#333 url('./aerial.webp') center/cover no-repeat}
#loading{width:min(250px,80vw);color:#fff;text-shadow:0 1px 6px #0008}
#loadLabel{margin:0 0 12px;font-weight:600;letter-spacing:-.03em}
#loadTrack{height:3px;overflow:hidden;border-radius:3px;background:#ffffff42}
#loadTrack::after{content:"";display:block;width:42%;height:100%;background:white;animation:loadingSweep 1.35s ease-in-out infinite;will-change:transform}
@keyframes loadingSweep{from{transform:translateX(-100%)}to{transform:translateX(240%)}}
@media(prefers-reduced-motion:reduce){#loadTrack::after{animation:none}}
#lightStart,#photoWalk{display:inline-block;margin-top:14px;color:white;pointer-events:auto}
button{font:inherit;cursor:pointer;border:0}
#retry{pointer-events:auto;border-radius:99px;background:#fff;color:#111;padding:14px 23px;font-weight:700;box-shadow:0 4px 22px #0004}
body[data-view="aerial"] #arrival{place-items:center;padding:0 16px}
#enter{pointer-events:auto;max-width:100%;min-height:clamp(62px,8vw,78px);padding:16px clamp(22px,4vw,52px);border:1px solid #e3e3e3;border-radius:999px;background:#fff;color:#171717;font-size:clamp(18px,2.4vw,26px);font-weight:600;letter-spacing:-.025em;line-height:1.35;word-break:keep-all;text-wrap:balance}
#enter:active{background:#f5f5f5}
body:not([data-view="aerial"]) #entryPrompt{display:none}
#entryPrompt{position:relative;max-width:100%}
#enter{display:flex;align-items:center;gap:17px;padding:10px 29px 10px 11px;text-align:left;line-height:1.15}
.playMark{width:44px;height:44px;flex:none;display:grid;place-items:center;background:#191919;color:#fff;border-radius:50%}
.playMark svg{width:15px;height:15px;margin-left:2px;fill:currentColor}
.startLabel{display:grid;gap:3px}
.startLabel small{font-size:12px;font-weight:550;color:#595959;letter-spacing:.015em}
.entryHelp{display:none}
.controlIcon{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#settings{position:fixed;top:16px;left:16px;z-index:3;display:flex;gap:8px;align-items:center}
#settings,dialog button,dialog select{border:0;border-radius:9px;padding:9px 13px;background:#f4f4f4;color:#171717;font:inherit}
#settings{background:#fff;color:#171717;border:1px solid #dedede;border-radius:999px}
body:not([data-view="aerial"]):not([data-view="walking"]) #settings{display:none}
kbd{font:600 12px system-ui;border:1px solid #9997;border-radius:4px;padding:2px 5px}
dialog{width:min(380px,92vw);max-height:86dvh;overflow:auto;border:1px solid #dedede;border-radius:18px;padding:22px;background:#fff;color:#171717;box-shadow:0 16px 48px #0002}
dialog::backdrop{background:#11111166}
dialog header,dialog label{display:flex;align-items:center;justify-content:space-between;gap:12px}
dialog h2{margin:0;font-size:23px}dialog h3{font-size:15px;margin:0 0 10px}dialog section,dialog label{margin-top:15px;border-top:1px solid #e6e6e6;padding-top:13px}
.archiveLinks{display:flex;flex-wrap:wrap;gap:8px}
.archiveLinks a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1px solid #dedede;border-radius:9px;color:inherit;text-decoration:none;font-size:14px}
.archiveLinks a:hover,.archiveLinks a:focus-visible{background:#f4f4f4}
#avatarMessage:empty{display:none}
dialog p{margin:4px 0;color:#464646;font-size:14px}
#places button{margin:2px 2px 2px 0;font-size:14px}
#status{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#171717ed;border-radius:10px;padding:8px 14px;width:max-content;max-width:92vw;text-align:center;font-size:13px}
body:not([data-view="walking"]) #status,#status:empty{display:none}
button:focus-visible,select:focus-visible{outline:3px solid #555;outline-offset:3px}
#touchControls,.touchHelp{display:none}
@media(any-pointer:coarse){
  body{overscroll-behavior:none}
  canvas,#touchControls{touch-action:none;user-select:none;-webkit-user-select:none}
  body[data-view="walking"] #touchControls{display:block}
  #settings{top:max(12px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));width:44px;height:44px;justify-content:center;padding:0;border:1px solid #fff9;background:#15151599;color:#fff}
  #settings kbd,#settings .settingsLabel,.desktopHelp{display:none}
  .touchHelp{display:block}
  body[data-view="aerial"] .entryHelp{display:block;position:absolute;top:100%;left:50%;transform:translateX(-50%);width:max-content;max-width:90vw;margin:10px 0 0;color:#fff;font-size:12px;font-weight:600;text-align:center;text-shadow:0 1px 4px #000,0 1px 9px #000}
  #stick,#jump{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));display:grid;place-items:center;border-radius:50%;border:1px solid #fff9;background:#15151580;color:#fff;touch-action:none;-webkit-tap-highlight-color:transparent}
  #stick{left:calc(20px + env(safe-area-inset-left));width:96px;height:96px}
  #stick::before{content:"";position:absolute;inset:6px;border-radius:50%;background:linear-gradient(#fffb,#fffb) center top/2px 5px,linear-gradient(#fffb,#fffb) center bottom/2px 5px,linear-gradient(#fffb,#fffb) left center/5px 2px,linear-gradient(#fffb,#fffb) right center/5px 2px;background-repeat:no-repeat;pointer-events:none}
  #stick span{width:33px;height:33px;border-radius:50%;background:#f8f8f8;box-shadow:0 1px 3px #0004;pointer-events:none}
  #jump{right:calc(22px + env(safe-area-inset-right));width:68px;height:68px;padding:0}
  #jump .controlIcon{width:29px;height:29px;stroke-width:2}
  #tapMark{position:fixed;z-index:1;pointer-events:none;transform:translate(-50%,-50%);width:24px;height:24px;border:2px solid white;background:#1119;border-radius:50%;text-align:center;line-height:18px;color:white;box-shadow:0 0 0 4px #ffffff40}
  #jump:active{background:#fff;color:#171717;transform:scale(.96)}
  #status{top:max(66px,calc(env(safe-area-inset-top) + 52px));bottom:auto;text-align:center;pointer-events:none}
  dialog button,dialog select{min-height:44px}
}
</style>

<body data-view="loading">
<div id="arrival">
  <div id="loading"><p id="loadLabel" role="status">거리 불러오는 중…</p><div id="loadTrack" role="progressbar" aria-labelledby="loadLabel"></div><a id="lightStart" href="?quality=low">그래픽 낮음 모드로 열기</a> <button id="retry" hidden>다시 시도</button> <a id="photoWalk" hidden href="./archive/index.html#map">사진으로 거리 둘러보기</a></div>
  <div id="entryPrompt"><button id="enter" hidden aria-label="강남 역삼로 415 성진빌딩 실제로 걸어보기"><span class="playMark" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3 1.8q0-.8.7-.4l10 6.1q.8.5 0 1l-10 6.1q-.7.4-.7-.4z"/></svg></span><span class="startLabel"><small>강남 역삼로 415</small>성진빌딩 실제로 걸어보기</span></button><p class="entryHelp">왼손으로 이동 · 화면을 밀어 둘러보기 · 오른손으로 점프</p></div>
</div>
<button id="settings" aria-label="설정 열기" aria-haspopup="dialog"><svg class="controlIcon" aria-hidden="true" viewBox="0 0 24 24"><path d="m9.5 3-.6 2.3-1.6.9L5 5.6 2.8 9.4l1.7 1.6v2l-1.7 1.6L5 18.4l2.3-.6 1.6.9.6 2.3h5l.6-2.3 1.6-.9 2.3.6 2.2-3.8-1.7-1.6v-2l1.7-1.6L19 5.6l-2.3.6-1.6-.9-.6-2.3z"/><circle cx="12" cy="12" r="3"/></svg><span class="settingsLabel">설정</span> <kbd>ESC</kbd></button>
<span id="status" role="status"></span>
<span hidden aria-hidden="true" id="tapMark"></span>
<div id="touchControls"><div id="stick" aria-label="이동 조이스틱"><span></span></div><button id="jump" aria-label="점프"><svg class="controlIcon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 16V4m-5 5 5-5 5 5M6 20h12"/></svg></button></div>
<dialog id="menu" aria-labelledby="menuTitle">
  <header><h2 id="menuTitle">설정</h2><button id="closeMenu" aria-label="설정 닫기">닫기</button></header>
  <label>그래픽 <select id="quality" aria-describedby="qualityInfo"><option value="auto">자동</option><option value="low">그래픽 낮음 모드</option></select></label>
  <p id="qualityInfo">그래픽을 바꾸면 거리를 다시 엽니다.</p>
  <label>캐릭터 <select id="avatar"><option value="man">남자</option><option value="woman">여자</option></select></label>
  <p id="avatarMessage" role="status"></p>
  <section><h3>조작법</h3><div class="desktopHelp"><p>WASD · 방향키로 이동 / 마우스로 둘러보기</p><p>Shift 달리기 · Space 점프 · 휠로 거리 조절</p><p>Esc 설정 열기 · 닫기</p></div><div class="touchHelp"><p>왼쪽 조이스틱으로 이동하고 끝까지 밀면 달립니다.</p><p>바닥을 탭하면 그곳으로 이동합니다. 화면을 밀어 둘러보고, 오른쪽 아래 버튼으로 점프하세요.</p></div></section>
  <section id="places"><h3>위치 이동</h3><button id="detail">이디야 앞</button><button id="parking">뒤편 주차장</button><button id="reset">시작 위치</button></section>
  <section><h3>제작 과정</h3><nav class="archiveLinks" aria-label="제작 과정"><a href="./archive/index.html" target="_blank" rel="noopener">제작 기록 ↗</a><a href="./archive/chat/index.html" target="_blank" rel="noopener">제작 대화 ↗</a></nav></section>
</dialog>
<script type="module">
const address=new URL(location.href);
const choice=address.searchParams.get('quality');
let quality='auto';
try{
  quality=localStorage.getItem('street-quality')==='low'?'low':'auto';
  if(choice==='auto'||choice==='low')localStorage.setItem('street-quality',choice);
}catch{}
if(choice==='auto'||choice==='low')quality=choice;
const selector=document.querySelector('#quality');
selector.value=quality;
document.querySelector('#lightStart').hidden=quality==='low';
selector.onchange=()=>{
  address.searchParams.set('quality',selector.value);
  location.assign(address);
};
function showError(){
  document.body.dataset.view='error';
  document.querySelector('#arrival').hidden=false;
  document.querySelector('#loading').hidden=false;
  document.querySelector('#enter').hidden=true;
  document.querySelector('#loadLabel').textContent='거리를 열 수 없습니다. 브라우저의 그래픽 설정과 연결을 확인해 주세요.';
  document.querySelector('#loadTrack').hidden=true;
  document.querySelector('#photoWalk').hidden=false;
  document.querySelector('#retry').hidden=false;
}
document.querySelector('#retry').onclick=()=>location.reload();
import('./street.js?v=quality3').then(module=>module.main(quality)).catch(error=>{console.error(error);showError();});
</script>
</body></html>
